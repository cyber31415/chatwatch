name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (the versions the container uses)
        run: pip install aiohttp==3.12.15 websockets==13.1 numpy==2.1.2 onnxruntime==1.20.1 tokenizers==0.20.3 pytest==8.3.3
      - name: Tests
        run: python -m pytest -q
