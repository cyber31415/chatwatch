<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatwatch</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e8eaf0; --dim:#9aa3b2; --faint:#8a93a3; --accent:#9147ff;
    --ok:#3ddc97; --warn:#ffb347; --bad:#ff6b6b; --info:#5cc8ff;
    --benign:#3ddc97; --mild:#ffd166; --badfaith:#ff6b6b;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  /* the page is a column: header, strip, banners, then the two cards take what is left (LF-6) */
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;min-height:100vh;height:100vh}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line);
         background:var(--panel);flex:none}
  header h1{font-size:15px;margin:0;letter-spacing:1.5px;font-weight:800}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--faint);margin-right:6px}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .strip .st{color:var(--text);white-space:nowrap}
  .strip .st.off{color:var(--warn)}
  .strip .st .note{color:var(--dim)}
  .stats{display:contents}
  header .right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}
  .strip .late{color:var(--warn)}
  .errs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .err-pill{font-size:11px;border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:0 7px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:16px;padding:3px 10px;font-size:13px;
       cursor:pointer;display:inline-flex;gap:5px;align-items:center;font-family:inherit}
  .tab.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .tab.stopped{opacity:.6;text-decoration:line-through}
  .tab.stale{opacity:.6}
  /* the server is not reachable: the lists are the last ones it sent (LF4-1) */
  body.offline main{opacity:.65}
  .cnt{font-size:10px;font-weight:700;border-radius:8px;padding:0 5px;color:#111}
  .cnt.act{background:var(--bad)} .cnt.watch{background:var(--warn)}
  .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ctl .at{color:var(--dim)}
  .ctl input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:14px;min-width:0;width:min(220px,60vw)}
  .ctl input:focus{outline:none;border-color:var(--accent)}
  .ctl input:disabled{opacity:.6}
  .ctl button{cursor:pointer;border-radius:8px;padding:6px 16px;font-size:14px;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff}
  .ctl button.stop{background:transparent;border-color:var(--bad);color:var(--bad)}
  .ctl button:disabled,.btn:disabled{opacity:.5;cursor:default}
  .ctl .err{color:var(--bad);font-size:12px}
  #aiPanel .sess{color:var(--faint);font-size:11px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  /* room strip: this channel's numbers */
  .strip{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--dim);flex:none}

  .strip b{color:var(--text);font-size:16px;font-variant-numeric:tabular-nums;margin-right:4px}

  .banners{display:flex;flex-direction:column;gap:6px;padding:0 16px;flex:none;max-height:30vh;overflow-y:auto}
  .banners:empty{display:none}
  .banner{border:1px solid var(--warn);border-radius:8px;padding:6px 10px;margin-top:8px;font-size:13px;
          background:color-mix(in srgb,var(--warn) 12%,transparent)}
  .banner b{font-size:13px}
  .banner.sys{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
  main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;padding:12px 16px;flex:1;min-height:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;
        min-height:0;height:100%;position:relative}
  @media (max-width:900px){
    body{height:auto}
    main{grid-template-columns:minmax(0,1fr)}
    .card{height:70vh;min-height:320px}
  }
  .card h2{margin:0;padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);
           border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;min-height:38px;flex-wrap:wrap}
  .sp{flex:1}
  .scroll{overflow-y:auto;flex:1;padding:6px 8px;min-height:0}
  .filters{display:flex;gap:4px;flex-wrap:wrap}
  .filters button{font-size:11px;padding:2px 9px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
                        color:var(--dim);cursor:pointer;text-transform:none;letter-spacing:0;font-family:inherit}
  .filters button.on{color:var(--text);border-color:var(--accent)}
  .line{padding:2px 4px;border-radius:6px;display:flex;gap:6px;align-items:baseline}
  .line:hover{background:var(--panel2)}
  .line.flagged{background:color-mix(in srgb,var(--bad) 9%,transparent)}
  .line.mod{color:var(--dim);font-style:italic}
  .line.gap{color:var(--dim);font-style:italic;font-size:12px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);border-radius:0;cursor:default}
  .pip{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(1px);display:inline-block}
  .t{color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums;flex:none}
  .who{font-weight:700;cursor:pointer;flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who:hover{text-decoration:underline}
  .msg{flex:1;min-width:0;overflow-wrap:anywhere}
  bdi{unicode-bidi:isolate}
  .chip{display:inline-block;font-size:10px;padding:0 6px;border-radius:8px;border:1px solid var(--line);color:var(--dim);margin-left:3px;white-space:nowrap}
  .chip.first{border-color:var(--info);color:var(--info)}
  .chip.bad{border-color:var(--bad);color:var(--bad)}
  .chip.warn{border-color:var(--warn);color:var(--warn)}
  .lvl{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:0 6px;border-radius:8px;margin-left:3px}
  .lvl.act{background:var(--bad);color:#111}
  .lvl.watch{background:var(--warn);color:#111}
  .empty{color:var(--faint);padding:10px;font-size:13px}
  .older{display:block;margin:4px auto 8px;font-size:12px}
  /* "N new messages" while the reader is scrolled up (LF-2) */
  .jump{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:3;border:1px solid var(--accent);background:var(--accent);
        color:#fff;border-radius:16px;padding:4px 14px;font-size:12px;cursor:pointer;box-shadow:0 2px 10px #0008;font-family:inherit}
  /* watchlist: one card per person */
  .hu{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:6px 8px;margin:5px 0;cursor:pointer;background:var(--panel2)}
  .hu.act{border-left-color:var(--bad)}
  .hu:hover{border-color:var(--accent)}
  .hu.group{cursor:default}
  .hu .top{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
  .hu .why{font-size:12px;margin-top:2px}
  .hu .q{font-size:12px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .more{padding:4px 6px}
  details.earlier summary{cursor:pointer;font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin:10px 4px 4px}
  .erow{font-size:12px;padding:2px 6px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
  .erow:hover{background:var(--panel2)}
  /* drawer (user card) */
  #drawer{position:fixed;top:0;right:0;width:min(560px,100vw);height:100vh;background:var(--panel);border-left:1px solid var(--line);
          transform:translateX(105%);visibility:hidden;transition:transform .2s,visibility 0s .2s;z-index:20;overflow-y:auto;padding:16px}
  #drawer.open{transform:none;visibility:visible;transition:transform .2s}
  #drawer h3{margin:0;font-size:20px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  #drawer section{margin:14px 0}
  #drawer h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:var(--dim)}
  .box{border:1px solid var(--line);border-left:4px solid var(--faint);border-radius:8px;padding:7px 10px;margin-top:10px;background:var(--panel2);font-size:13px}
  .box.act{border-left-color:var(--bad)} .box.watch{border-left-color:var(--warn)} .box.read{border-left-color:var(--accent)}
  .upd{border:1px solid var(--info);border-radius:8px;padding:5px 10px;margin-top:8px;font-size:12px;color:var(--info)}
  .arow{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
  .track{background:var(--panel2);height:10px;border-radius:5px;overflow:hidden}
  .track i{display:block;height:100%}
  .reason{font-size:13px;display:flex;gap:8px;margin:2px 0}
  .reason .w{font-variant-numeric:tabular-nums;width:46px;text-align:right;flex:none}
  .rmsg{font-size:13px;padding:4px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
  .warnbox{background:var(--panel2);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;font-size:14px}
  .close{float:right;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:4px 10px;cursor:pointer}
  .btn{border:1px solid var(--accent);background:transparent;color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;font-family:inherit}
  .note{font-size:12px;color:var(--dim)}
  details.sect{margin:10px 0}
  details.sect summary{cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:var(--dim)}
  details.sect[open] summary{margin-bottom:6px}
  /* reclassify a message (the owner's correction; live watchlist only, never a label) */
  .rc{border:1px solid transparent;background:transparent;color:var(--dim);border-radius:6px;padding:0 5px;margin-left:3px;cursor:pointer;font:inherit;font-size:12px;line-height:1.2}
  .rc{opacity:.55} .line:hover .rc,.rmsg:hover .rc{opacity:1}
  .rc:hover,.rc:focus-visible{border-color:var(--line);color:var(--text);opacity:1}
  .chip.owner{border-style:dashed;border-color:var(--accent);color:var(--text)}
  #rcMenu{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.5);min-width:220px}
  #rcMenu .h{font-size:11px;color:var(--dim);padding:2px 6px 6px;text-transform:uppercase;letter-spacing:1px}
  #rcMenu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:5px 8px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
  #rcMenu button:hover,#rcMenu button:focus-visible{background:var(--panel2)}
  #rcMenu button.cur{font-weight:700}
  #rcMenu .err{color:var(--bad);font-size:12px;padding:4px 8px}
  #rcMenu .err.busy{color:var(--dim)}
  #rcMenu .q{font-size:12px;color:var(--text);padding:0 6px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px}
  #rcMenu button:disabled{opacity:.5;cursor:default}
  /* the messages behind a listing (a watchlist card's reason opens them) and the owner's "bot" role (owner, 2026-11-01) */
  .hu .why.ev{cursor:pointer;text-decoration:underline dotted var(--faint);text-underline-offset:3px}
  .hu .why.ev:hover{color:var(--text)}
  .evl{margin-top:6px;border-top:1px solid var(--line);padding-top:2px;cursor:default;max-height:50vh;overflow-y:auto}   /* LF3-7: 100 items stay in one card-sized box */
  .evl .rmsg{font-size:12px;padding:3px 0}
  .evl .rmsg:last-of-type{border-bottom:0}
  .rolesPill{border:1px dashed var(--accent);background:transparent;color:var(--dim);border-radius:8px;padding:2px 8px;font-size:12px;cursor:pointer;font-family:inherit}   /* not a channel tab (LF3-8) */
  .rolesPill:hover{color:var(--text)}
  .hu .nm{cursor:pointer}
  /* the roles list: a long name gives way, Remove never wraps (LF4-8) */
  .rrow{display:flex;gap:8px;align-items:center}
  .rrow b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rrow .note{flex:none;white-space:nowrap}
  .rrow .btn{flex:none;white-space:nowrap}
  .line.bot{color:var(--dim)}
  .line.bot .pip{background:transparent;border:1px solid var(--line)}
  /* touch screens have no hover: the ⋯ is a full-size, visible target (N-9, WCAG 2.5.8) */
  @media (pointer:coarse){ .rc{min-height:24px;min-width:28px;opacity:.9} }
  /* the AI: which model reads, and how fast, before Start (docs/DASHBOARD.md "Choosing the AI") */
  #aiPanel{border-bottom:1px solid var(--line);padding:8px 16px;font-size:13px;color:var(--dim);flex:none;background:var(--panel)}
  #aiPanel .sum{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  #aiPanel .sum b{color:var(--text)}
  #aiPanel .spec{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
  #aiPanel select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:1px 4px;font:inherit;font-size:12px}
  #aiPanel .rowsAI{margin-top:6px;display:flex;flex-direction:column;gap:2px;max-height:34vh;overflow-y:auto}
  #aiPanel label.r{display:grid;grid-template-columns:18px 270px 1fr auto;gap:8px;align-items:baseline;padding:3px 6px;border-radius:6px;cursor:pointer}
  #aiPanel label.r:hover{background:var(--panel2)}
  @media (max-width:700px){              /* phone: the name above its numbers, the button under them */
    #aiPanel label.r{grid-template-columns:18px minmax(0,1fr)}
    #aiPanel label.r > span:nth-of-type(n+2){grid-column:2}
  }
  #aiPanel label.r.sel{background:color-mix(in srgb,var(--accent) 14%,transparent)}
  #aiPanel label.r.off{opacity:.55;cursor:default}
  #aiPanel .nm{color:var(--text);font-weight:600}
  #aiPanel .num{font-variant-numeric:tabular-nums}
  #aiPanel .k{color:var(--text);font-weight:700}
  #aiPanel .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  #aiPanel code{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--text)}
  #aiPanel .warnT{color:var(--warn)} #aiPanel .badT{color:var(--bad)} #aiPanel .okT{color:var(--ok)}

  .btn.small{font-size:11px;padding:1px 8px}
  /* the hybrid's Review box, under the Watchlist header: the button and its time, the scope, the last press */
  #reviewBox{display:flex;flex-direction:column;gap:4px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
  #reviewBox[hidden]{display:none}
  #reviewBox .rvrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #reviewBox .rvrow > span{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
  #reviewBox label{display:inline-flex;gap:4px;align-items:center;cursor:pointer;color:var(--text)}
  #reviewBox b{color:var(--text)}
  #reviewBox .btn{font-size:12px;padding:2px 9px}
  .ptitle{display:inline-flex;gap:5px;align-items:center}
  /* an (i) beside a control with more to say (owner 2026-11-10): hover shows it, a click or Enter keeps it open below */
  .info{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;padding:0;flex:none;
        border:1px solid var(--dim);background:none;color:var(--dim);font:italic 700 11px/1 Georgia,"Times New Roman",serif;cursor:pointer}
  .info:hover,.info:focus-visible,.info[aria-expanded="true"]{color:var(--text);border-color:var(--accent)}
  .infoPop{display:block;margin-top:4px;font-weight:400;font-style:normal;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
  #reviewBox .rvrow > .infoPop{flex:1 1 100%;margin-top:0}
  .info{margin-left:4px;vertical-align:1px}
  footer{padding:0 16px 10px;color:var(--dim);font-size:12px;flex:none}
</style>
</head>
<body>
<header>
  <h1>CHATWATCH</h1>
  <nav class="tabs" id="tabs" aria-label="Channels"></nav>
  <div class="right">
    <button class="rolesPill" id="rolesBtn" hidden title="chatters you marked as bots: see and undo them"></button>
    <div class="ctl" id="ctl" hidden>
      <span class="at">twitch.tv/</span>
      <input id="chanInput" placeholder="channel" autocomplete="off" spellcheck="false" aria-label="Channel to watch">
      <button id="startBtn">Start</button>
      <span class="err" id="ctlErr" role="alert"></span>
    </div>
  </div>
</header>
<section id="aiPanel" aria-label="The AI that reads chat" hidden></section>
<!-- the stats line (owner 2026-11-08): the status first, then this session's numbers, then any server-error pills -->
<div class="strip" id="strip"><span class="st" id="status" role="status"><span class="dot"></span>connecting…</span><span class="stats" id="stripStats"></span><span class="errs" id="errs"></span></div>
<div class="banners" id="banners"></div>
<main>
  <section class="card">
    <h2>Live chat <span class="sp"></span>
      <span class="filters" id="filters" role="group" aria-label="Chat filter">
        <button data-f="all">All</button>
        <button data-f="first">First-timers</button>
        <button data-f="flagged" title="every message marked toxic or with a warning chip (evasion, template, ban-lookalike, Twitch flag), and everything said by people on the Watchlist">Flagged</button>
      </span>
    </h2>
    <div class="scroll" id="chat"><div id="olderBox"></div><div id="rows"></div></div>
    <button class="jump" id="jump" hidden>Jump to latest</button>
  </section>
  <section class="card">
    <h2><span class="ptitle">Watchlist <span id="wlCount"></span></span></h2>
    <div id="reviewBox" hidden></div>
    <div class="scroll" id="pWatch"><div id="heads"></div><div id="headsMore"></div><div id="earlier"></div></div>
  </section>
</main>
<footer>Reads public chat anonymously and posts nothing. Reads are probabilistic first impressions of what someone is
  <i>doing</i> in chat, not judgements of who they are. Never show them to chatters or on stream.</footer>
<aside id="drawer" role="dialog" aria-labelledby="dTitle" inert></aside>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FAMCOL = {benign:"var(--benign)", mild:"var(--mild)", badfaith:"var(--badfaith)"};
const ARCH = {
  ordinary:["Ordinary","benign"], reactor:["Reactor","benign"], newcomer:["Newcomer","benign"],
  asker:["Asker","benign"], supporter:["Supporter","benign"], backseater:["Backseater","mild"],
  provocateur:["Provocateur","badfaith"], concern_troll:["Concern troll","badfaith"],
  injector:["Topic injector","badfaith"], harasser:["Harasser","badfaith"], spammer:["Spam/bot","badfaith"]
};
const arch = k => ARCH[k] || [String(k), "mild"];        // an archetype added on the server must not stop the page (LF-14)
// message flags: the ones shown as chips; every flag is in the line's tooltip
const FLAGTXT = {first:["1st","first"], evasion:["evasion","bad"], template:["template","bad"], lookalike:["ban-lookalike","bad"],
  "twitch-flag":["twitch flag","bad"], "new-account":["new acct","warn"], "coded-vocab":["coded vocab","warn"],
  distress:["possible distress","first"]};
const FLAGGED = ["evasion", "template", "lookalike", "twitch-flag"];
const LVTXT = {act: "likely", watch: "possible"};   // keys stay act/watch; wording is a read, not an instruction
const SHOW_N = 12;                                   // watchlist cards before "+N more"
const PANEL_MAX = 40;                                // the server lists at most this many cards
const EV_KEPT = 100;                                // the flagged or corrected messages kept behind a listing (engine.py)
const CH_LINES = 1500;                               // kept per channel (LF-11)
const ROWS_FOLLOW = 300, ROWS_PAGE = 200;            // rows shown while following; rows added by "Show older"

let channel = "", channels = [], filter = "all", mode = "", showAll = false;
let running = false, stoppedAt = null;
const buf = {}, alerts = [], rooms = {}, lastTs = {};
try { filter = localStorage.getItem("cw_filter") || "all"; } catch(e){}
// older filters: "watch" (before 11-01) and "toxic" (2026-11-10: Flagged now holds every toxic line too)
if (filter === "watch" || filter === "toxic") filter = "flagged";
const chan = ch => buf[ch] || (buf[ch] = {lines: []});

// "now" for ages: the wall clock live (or the moment of Stop), the newest message's time in a replay
const nowMs = () => stoppedAt ? stoppedAt : mode === "live" || !lastTs[channel] ? Date.now() : lastTs[channel];
function ago(ts){ const s = Math.max(0, (nowMs() - ts) / 1000);
  return s < 60 ? "now" : s < 3600 ? `${Math.floor(s/60)} min ago` : s < 172800 ? `${Math.floor(s/3600)} h ago` : `${Math.floor(s/86400)} days ago`; }
function hhmm(ts){ return new Date(ts).toTimeString().slice(0, 8); }
function noticeMap(ch){            // user_id -> notice, for this channel's watchlist
  const r = rooms[ch], m = {};
  for (const n of ((r && r.notices && r.notices.items) || [])){
    m[n.user_id] = n;
    for (const g of n.group || []) m[g.user_id] = {...n, level: g.level, why: g.why || n.why};   // a member's own reason (LF-13)
  }

// ---------------------------------------------------------------- reclassify a message (the owner's correction)
// The correction decides the message's class for the live watchlist (the server's /api/override); it is never a
// label for training or measurement (docs/DASHBOARD.md "Reclassifying a message").

  evPatch(r);
  // every ⋯ of this message, in chat and in the open card: its chip, its pip and the class its menu shows (N-10)
  for (const b of document.querySelectorAll(`.rc[data-rc="${CSS.escape(String(r.id))}"]`)){
    if (b.dataset.rcc !== r.channel) continue;

    updateRows(r.id, el => { if (rcOpener && el.contains(rcOpener)) closeRc(false); el.remove(); });
    shown = shown.filter(x => String(x.id) !== String(r.id));

  // ... and a line that turns toxic joins it: rebuilt at the next render while following, else counted in the jump bar (LF4-5)
  else if (filter === "flagged" && r.channel === channel && m && isFlagged(m, NM) && !shown.includes(m)){

  const opt = (k, choices, v) => `<select data-ai-ov="${k}" aria-label="${k === "vram" ? "GPU memory" : "System RAM"}">${v ? "" : `<option value="" selected>pick</option>`}${choices.map(c =>
      `<option value="${esc(c)}" ${c === v ? "selected" : ""}>${esc(c === "none" ? "no GPU" : c + " GB")}</option>`).join("")}</select>`;
  const spec = `<div class="spec"><span>This machine:</span>
     <span>GPU ${esc(S.gpu_vendor === "none" ? "none" : `${S.gpu_name || S.gpu_vendor || "?"}`)}</span>${opt("vram", I.choices.vram, C.vram)}${M.vram_shown != null ? `<span class="note" data-avail="vram">${M.vram_shown} GB available${M.reserve_gb ? `, ${M.reserve_gb} GB kept for the desktop` : ""}</span>` : ""}
     <span>RAM</span>${opt("ram", I.choices.ram, C.ram)}${M.ram_shown != null ? `<span class="note" data-avail="ram">${M.ram_shown} GB available</span>` : ""}${M.ram_assumed && M.ram_total != null ? `<span class="note" data-ram-read="${M.ram_total}">${M.ram_total} GB read, below the lowest option</span>` : ""}<span>${S.cores ? `${S.cores} cores` : ""}</span>
     <span>Ollama ${esc((I.ollama || {}).version || "not answering")}</span>
     ${(C.overridden || {}).vram || (C.overridden || {}).ram ? `<span class="note">(set by you; read: ${S.vram_mb ? Math.round(S.vram_mb / 1024) + " GB" : "no"} GPU, ${S.ram_mb ? Math.round(S.ram_mb / 1024) + " GB" : "?"} RAM)</span>` : ""}
     <span class="note" data-tier-note>${tierNote(T)}</span></div>`;
  const m = aiPick.mode;
  // one list (owner 2026-11-07: "its better to just have it all on a single tab"): every setup that fits, best quality
  // first (a hybrid by its quality reviewing every flagged chatter), and "No AI" last: selectable, never recommended
  const items = [...(I.hybrids || []).map(h => ({q: h.quality.b_over_no_ai, html: hybHTML(h)})),
                 ...(I.rows || []).map(r => ({q: r.quality.over_no_ai, html: rowHTMLai(r)}))].sort((a, b) => b.q - a.q);
  const noneSel = m === "none", noneUse = (aiStatus.mode || I.choice.mode) === "none";
  const noAI = `<label class="r${noneSel ? " sel" : ""}"><input type="radio" name="aiRow" data-ai-none ${noneSel ? "checked" : ""}>
    <span class="nm">No AI${noneUse ? ` <span class="chip">in use</span>` : ""}</span>
    <span><span class="k" data-row-figs><span title="${esc(ACC_TIP)}">+0% accuracy</span> · Keeps up with any chat rate</span> · <span class="note">the baseline: word lists and a small, fast toxicity model, no large AI</span> · <span class="warnT" title="${esc(`real-chat test: ${I.no_ai.gate || ""}`)}">misses some severe messages the AI catches</span></span>
    <span></span></label>`;
  // what the numbers mean, for someone seeing the list for the first time (owner 2026-11-10)
  const sw = I.swap || {}, swMeasured = /^(last review here|last loads here)/.test(sw.label || "");
  const swTxt = sw.s ? (swMeasured ? `~${fmtMin(sw.s)}` : `<i>Estimated ~${fmtMin(sw.s)}</i> (Check Speed on both models measures it)`) : "";
  const h0 = (I.hybrids || [])[0], lq = h0 && ((I.rows || []).find(r => r.id === h0.live) || {}).quality;
  const pressTxt = lq ? ` Its accuracy assumes you press Review; between reviews it reads at the live model's level (+${lq.over_no_ai}%).` : "";
  const hybNote = (I.hybrids || []).length ? `<div class="note" data-hyb-note style="padding:2px 6px"><b>Hybrid:</b> a fast model reads every message live; a stronger model re-checks flagged chatters when you press Review on the Watchlist. It keeps up with busy chat and still gets the stronger model's judgement where it counts. While a review runs the live reading pauses (chat waits in the queue and is caught up after), and each review swaps the two models in and out${swTxt ? `: ${swTxt}` : ""}.${pressTxt}</div>` : "";
  const accNote = `<div class="note" data-acc-note style="padding:2px 6px"><b>Accuracy:</b> how well a setup marks toxic messages and picks out bad-faith chatters in real chat held out for testing, compared with No AI. The msgs/min figure is the busiest chat a setup keeps up with.</div>`;
  const list = `<div class="rowsAI">${items.map(x => x.html).join("") || (I.fit_note ? `<div class="note warnT" data-fit-note style="padding:2px 6px">${esc(shortName(I.fit_note))}</div>` : `<div class="note">${esc(T.why || "pick your GPU memory and RAM above")}</div>`)}${noAI}${accNote}${hybNote}</div>`;
  const cr = I.chat_rate && !I.chat_rate.error ? I.chat_rate : null;
  const sel = m === "single" ? (I.rows || []).find(r => r.id === aiPick.live) : m === "hybrid" ? (I.rows || []).find(r => r.id === aiPick.live) : null;
  let crTxt = "";
  if (cr){
    crTxt = `#${esc(cr.channel)}: <b>${cr.msgs_per_min}</b> msgs/min now (${cr.seconds} s)${cr.note ? " · " + esc(cr.note) : ""}`;
    if (sel && sel.speed && m !== "none"){
      const lim = sel.speed.keepup, r = cr.msgs_per_min, hy = m === "single" && (I.hybrids || []).length;
      crTxt += r > lim && !sel.speed.keepup_plus
        ? ` · <span class="warnT">above this setup's ${lim}: its reads will lag at this rate${hy ? "; a hybrid keeps up" : ""}</span>`
        : m === "single" && hy && !leadsAt(sel.speed, r)
        ? ` · <span class="warnT">within this setup's ${sel.speed.keepup_plus ? "≥" : ""}${lim}, but a hybrid catches more at this rate</span>`
        : ` · <span class="okT">within this setup's ${sel.speed.keepup_plus ? "≥" : ""}${lim}</span>`;
    }
  }
  if (aiStatus.rate_task) crTxt = `<span class="warnT">${esc(aiStatus.rate_task.state)}</span>`;
  const same = m === ch.mode && (m === "none" || (aiPick.live === ch.live && (m !== "hybrid" || aiPick.reviewer === ch.reviewer)));
  const act = `<div class="act"><button class="btn" data-ai-use ${same || task ? "disabled" : ""}>${same ? "In use" : "Use this"}</button>
     <button class="btn small" data-ai-rate ${aiStatus.rate_task ? "disabled" : ""} title="a short anonymous read-only join that only counts messages">Measure the channel's chat rate</button>
     <label class="note">or type <input type="number" min="1" max="5000" step="1" data-ai-typed value="${aiTypedRate || ""}" style="width:64px" aria-label="chat rate, msgs/min"> msgs/min</label>
     ${!RATE && (I.hybrids || []).length && m !== "none" ? `<span class="note">Measure the chat (or type its rate) to compare one model with a hybrid</span>` : ""}
     <span>${crTxt}</span><span class="badT">${esc(aiErr)}</span></div>`;
  setKeep(P, sum + spec + list + act);
}
async function aiPost(url, body){
  const j = await askJSON(url, body || {}, 30000);
  if (j.error){ aiErr = j.error; aiErrAt = Date.now(); renderAI(); return null; }
  aiErr = ""; return j;
}
function aiTaskDone(kind){                              // a task finished: a short note on the AI bar, reload the numbers
  const last = ((aiStatus || {}).last || {})[kind] || {};
  const say = html => { aiNote = html; aiNoteAt = Date.now(); };
  if (kind === "select") say(last.error ? `<span class="badT">not changed: ${esc(last.error)}</span>` : `switched in ${last.seconds} s`);
  if (kind === "speed" || kind === "chatrate") aiNote = "";
  aiPick = null; aiPickByUser = false;
  loadAI().then(() => {
    const L = (aiInfo && aiInfo.last || {})[kind] || {};
    const lab = ((aiInfo.rows || []).find(r => r.id === L.model) || {}).label || L.model;
    // the setup's own numbers are on the line already: the note says what the check found, its details in the tooltip
    if (kind === "speed") say(L.error ? `<span class="badT">speed check: ${esc(L.error)}</span>`
      : `<span title="${esc([`${L.person_s} s per person read`, L.num_gpu != null ? `${L.num_gpu} GPU layers` : "", `${L.aborts} runner aborts in ${L.calls} calls`, ...(L.notes || [])].filter(Boolean).join("; "))}">Checked ${esc(shortName(lab))}: ${L.keepup_plus ? "≥" : "~"}${L.keepup} msgs/min${L.aborts ? ` · <span class="badT">${L.aborts} failed calls</span>` : ""}</span>`);
    if (kind === "chatrate" && L.error) say(`<span class="badT">chat rate: ${esc(L.error)}</span>`);
    aiRedraw();
  });
}
function aiOnStatus(r){
  aiStatus = r.ai || {};
  const k = aiStatus.task ? aiStatus.task.kind : null;
  if (aiTaskKind && !k) aiTaskDone(aiTaskKind);
  const rk = aiStatus.rate_task ? "chatrate" : null;           // the chat count runs apart (no GPU)
  if (aiRateKind && !rk) aiTaskDone("chatrate");
  aiRateKind = rk;
  aiTaskKind = k;
  if (mode === "live" && (!aiInfo && !aiSeq || aiWasRunning && !running && !lastStatus.stopping
      || !aiInfo && aiErr && Date.now() - aiLoadAt >= AI_RETRY_MS)) loadAI();      // FE-4: a failed first read retries
  aiWasRunning = running || !!lastStatus.stopping;
  aiRedraw();
}
$("aiPanel").addEventListener("click", async e => {
  const t = e.target.closest("[data-ai-use],[data-ai-speed],[data-ai-rate],[data-ai-cancel],[data-ai-toggle]");
  if (!t) return;
  if (t.dataset.aiToggle !== undefined){ aiHidden = !aiHidden; try { localStorage.setItem("cw_ai_hidden", aiHidden ? "1" : "0"); } catch(e){} renderAI(); return; }
  if (t.dataset.aiCancel !== undefined){ await aiPost("/api/ai/cancel"); return; }
  if (t.dataset.aiSpeed){ e.preventDefault(); aiNote = ""; if (await aiPost("/api/ai/speed", {model: t.dataset.aiSpeed})) aiTaskKind = "speed"; return; }
  if (t.dataset.aiRate !== undefined){
    const c = ($("chanInput").value || "").split(/[\s,]+/).map(s => s.trim().toLowerCase().replace(/^#/, "")).filter(Boolean)[0];
    if (!c){ aiErr = "type the channel first (above, beside Start)"; renderAI(); return; }
    aiTypedRate = null; try { localStorage.setItem("cw_ai_rate", ""); } catch(e){}      // the measured rate replaces a typed one
    if (await aiPost("/api/ai/chatrate", {channel: c, seconds: 60})) aiRateKind = "chatrate"; return;
  }
  if (t.dataset.aiUse !== undefined){ aiNote = ""; if (await aiPost("/api/ai/select", aiPick)) aiTaskKind = "select"; }
});
$("aiPanel").addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.aiRow){ aiPickByUser = true; aiPick = {mode: "single", live: t.dataset.aiRow, reviewer: null}; renderAI(); }
  else if (t.dataset.aiNone !== undefined){ aiPickByUser = true; aiPick = {mode: "none", live: (aiInfo.choice || {}).live, reviewer: null}; renderAI(); }
  else if (t.dataset.aiHyb){ const [l, r] = t.dataset.aiHyb.split("|"); aiPickByUser = true; aiPick = {mode: "hybrid", live: l, reviewer: r}; renderAI(); }
  else if (t.dataset.aiTyped !== undefined){
    aiTypedRate = +t.value > 0 ? Math.min(+t.value, 5000) : null;
    try { localStorage.setItem("cw_ai_rate", aiTypedRate ? String(aiTypedRate) : ""); } catch(e){}
    // after a Tab has moved focus on, so the redraw keeps it where it went; guarded (FE-10, round 2): the change fires on
    // the mousedown that leaves the box for a button, and a redraw under that press would drop its click
    setTimeout(aiRedraw, 0);
  }
  else if (t.dataset.aiOv){
    aiOv = {...((aiInfo && aiInfo.classes) || {}), [t.dataset.aiOv]: t.value}; delete aiOv.overridden;
    await askJSON("/api/ai/override", {vram: aiOv.vram, ram: aiOv.ram}, 10000);
    aiPick = null; aiPickByUser = false; loadAI(true);
  }
});
function pfText(A){                                   // the hybrid's two models in memory: is the next review's swap quick?
  const pf = (A || {}).prefetch, sw = ((A || {}).review || {}).swap || {};
  if (!pf || pf.state === "none") return "";
  if (pf.state === "ready") return `<span class="okT" data-pf="ready" title="the reviewer was read into memory${pf.at ? " by " + hhmm(Date.parse(pf.at)) : ""} and both models' files are held open, so a review's swap does not read them from disk; estimate: ${esc(sw.label || "")}">Models in memory · Swap ~${fmtMin(sw.s || 35)}</span>`;
  if (pf.state === "reading") return `<span class="note" data-pf="reading" title="read slowly so the live AI keeps its speed; paused while a model loads">Loading the reviewer into memory: ${pf.done_gb} of ${pf.total_gb} GB</span>`;
  const measured = /^(last review here|last loads here|reviewer from disk)/.test(sw.label || "");
  return measured ? `<span class="warnT" data-pf="cold" title="${esc(sw.label)}">First review slower: ~${fmtMin(sw.s)} to load the reviewer from disk</span>`
    : `<span class="warnT" data-pf="cold" title="the first review reads the models from disk, which can take minutes">Reviewer not in memory yet: the first review is slower</span>`;
}
// the hybrid's Review button, at the top of the watchlist: one press = one swap for every chatter with new content
let scopeAlt = false;                                   // the checkbox: the other scope for this press
// a refused Review or Cancel: its error stays in the box for REVIEW_ERR_MS across redraws, then goes (FE-5)
const REVIEW_ERR_MS = 20000;
let reviewErr = null;                                   // {msg, at}
function renderReview(){
  const box = $("reviewBox"), A = aiStatus || {}, R = A.review;
  const show = A.mode === "hybrid" && (running || mode === "replay") && !!R;
  box.hidden = !show;
  if (!show) return;
  const def = A.scope_default || "b", scope = scopeAlt ? (def === "b" ? "a" : "b") : def, s = R[scope] || {chatters: 0};
  const task = A.task && A.task.kind === "review" ? A.task : null, other = A.task && !task;
  // owner 2026-11-10: the button and its time on the first line; under it the checkbox and the count it covers, split into
  // the Watchlist and everyone else with a new toxic message (scope b = the Watchlist + chatters with a toxic line not on it;
  // a warning chip alone, Flagged in chat, does not bring a chatter into the review: audit polish F4)
  const nA = (R.a || {}).chatters || 0, nB = (R.b || {}).chatters || 0, nOther = Math.max(0, nB - nA);
  const altTxt = def === "b" ? "Review Watchlist only" : "Also review others with toxic messages";
  const split = scope === "b" ? `<b>${nB}</b> chatter${nB === 1 ? "" : "s"} with new messages: <b>${nA}</b> on the Watchlist + <b>${nOther}</b> other${nOther === 1 ? "" : "s"} with toxic messages`
    : `<b>${nA}</b> Watchlist chatter${nA === 1 ? "" : "s"} with new messages${nOther ? ` (${nOther} other${nOther === 1 ? "" : "s"} with toxic messages not included)` : ""}`;
  // the pair's own quality from GET /api/ai (FE-3: was the 12B + 31B pair's +62% / +54% for every pair)
  const h = aiInfo && (aiInfo.hybrids || []).find(x => x.live === A.live && x.reviewer === A.reviewer), Q = h && h.quality;
  const tip = `${s.chatters} chatters with new messages (${s.lines} new lines to re-read). `
    + `The reviewer reads each as a person and re-reads their new lines; the live AI pauses meanwhile and catches up after (chat keeps queueing). Per chatter: ${esc(R.basis)}; swap: ${esc((R.swap || {}).label || "")}.`
    + (Q ? ` Accuracy: +${Q.b_over_no_ai}% over No AI reviewing all flagged chatters, +${Q.a_over_no_ai}% the Watchlist only.` : "");
  const scopeTip = def === "b" ? `Fewer chatters and a shorter pause${Q ? `; accuracy +${Q.a_over_no_ai}% instead of +${Q.b_over_no_ai}%` : ""}.`
    : `More chatters and a longer pause${Q ? `; accuracy +${Q.b_over_no_ai}% instead of +${Q.a_over_no_ai}%` : ""}.`;
  const rvInfo = `The stronger model reads each of these ${s.chatters} chatters as a whole and re-checks their ${s.lines} new messages, then the live model takes over again. While it runs the live reading pauses; chat waits in the queue and is caught up after.`;
  const last = (A.last || {}).review;
  const lastTxt = !task && last && last.at ? `<div class="rvrow"><span class="note" data-review-last title="${esc(last.error || last.swap_back_error || "")}">Last review: ${last.reviewed}/${last.chatters} reviewed${last.failed ? `, ${last.failed} failed` : ""}${last.cancelled ? ", cancelled" : ""}${last.stopped_for_live ? `, stopped to keep the live AI current (${last.stopped_for_live.left} left for the next press)` : ""}${last.error ? `, <span class="badT">${esc(last.error)}</span>` : ""} in ${fmtMin((last.timings || {}).outage_s || 0)}${last.catchup_s != null ? `; live caught up ${fmtMin(last.catchup_s)} after` : ""}</span></div>` : "";
  const err = reviewErr && Date.now() - reviewErr.at < REVIEW_ERR_MS ? ` <span class="badT" data-review-err>${esc(reviewErr.msg)}</span>` : "";
  setKeep(box, task
    ? `<div class="rvrow"><span class="warnT">${esc(taskText(task))}</span><button class="btn" data-review-cancel>Cancel</button>${err}</div>`
    : `<div class="rvrow"><button class="btn" data-review ${!s.chatters || other || lastStatus.stopping ? "disabled" : ""} title="${esc(tip)}">${s.chatters ? `Review ${s.chatters}` : "Nothing new to review"}</button>`
      + (s.chatters ? `<span title="${esc(tip)}">~${fmtMin(s.seconds)} · the live AI pauses meanwhile${infoBtn("review", rvInfo)}</span>` : "") + err + infoPop("review", rvInfo) + `</div>`
      + `<div class="rvrow"><label title="${esc(scopeTip)}"><input type="checkbox" data-scope ${scopeAlt ? "checked" : ""}>${altTxt}</label>${infoBtn("scope", scopeTip)}<span class="note" data-review-split>${split}</span>${infoPop("scope", scopeTip)}</div>`
      + lastTxt);
}
$("reviewBox").addEventListener("click", async e => {
  const i = e.target.closest("[data-info]");
  if (i){ infoOpen = infoOpen === i.dataset.info ? null : i.dataset.info; renderReview(); return; }
  const t = e.target.closest("[data-review],[data-review-cancel]"); if (!t) return;
  e.stopPropagation();
  const A = aiStatus || {}, def = A.scope_default || "b", scope = scopeAlt ? (def === "b" ? "a" : "b") : def;
  const j = await askJSON(t.dataset.reviewCancel !== undefined ? "/api/ai/cancel" : "/api/review", {scope}, 30000);
  reviewErr = j.error ? {msg: j.error, at: Date.now()} : null;
  renderReview();
});
$("reviewBox").addEventListener("keydown", e => { if (e.key === "Escape" && infoOpen){ infoOpen = null; renderReview(); } });   // Escape folds an open (i)
$("reviewBox").addEventListener("change", e => { if (e.target.dataset.scope !== undefined){ scopeAlt = e.target.checked; renderReview(); } });

// ---------------------------------------------------------------- clicks and keys
function activate(t, e){
  if (t.dataset.rcopt){ chooseRc(t); return; }
  if (t.dataset.rc !== undefined){ if (rcOpener === t) closeRc(); else openRc(t); return; }
  if (t.dataset.evbox) return;                          // a click inside the dropdown is not a click on the card
  if (t.dataset.ev !== undefined){ toggleEv(t.dataset.ev); return; }
  if (t.dataset.role !== undefined || t.dataset.unrole !== undefined){ setRole(t); return; }
  if (t.id === "rolesBtn"){ opener = t; openRoles(); return; }
  if (t.dataset.close){ closeDrawer(); return; }
  if (t.dataset.reload && card){ if (card.uid) openCard(card.uid, card.ch); else openRoles(); return; }
  if (t.id === "showAllBtn"){ showAll = !showAll; renderWatch(); return; }
  if (t.id === "olderBtn"){ showOlder(); return; }
  if (t.dataset.ch){ if (channel !== t.dataset.ch){ channel = t.dataset.ch; switchView(); } return; }
  if (t.dataset.f){ filter = t.dataset.f; try { localStorage.setItem("cw_filter", filter); } catch(e){}
    renderFilters(); switchView(); return; }
  if (t.dataset.uid){ openCard(t.dataset.uid, channel, t); }
}
const TARGETS = "[data-rcopt],[data-rc],[data-evbox],[data-ev],[data-role],[data-unrole],[data-uid],[data-ch],[data-f],[data-close],[data-reload],#showAllBtn,#olderBtn,#rolesBtn";
document.addEventListener("click", e => {
  if ($("rcMenu") && !e.target.closest("#rcMenu,[data-rc]")) closeRc(false);      // a click elsewhere closes the menu
  const t = e.target.closest(TARGETS); if (t) activate(t, e); });
// the menu is placed beside its ⋯: when what holds the ⋯ scrolls, it would sit beside another line, so it closes (N-2)
document.addEventListener("scroll", e => {
  const el = $("rcMenu"); if (!el || !rcOpener || rcBusy) return;
  const box = e.target === document ? document.documentElement : e.target;
  if (box && box.contains && !el.contains(box) && box.contains(rcOpener)) closeRc(false);
}, true);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("rcMenu")){ closeRc(); return; }
  if (e.key === "Escape" && evOpen && evOpen.ch === channel){              // folds the open dropdown it is in (LF3-6)
    const c = $("heads").querySelector(`.hu[data-uid="${CSS.escape(String(evOpen.uid))}"]`);
    if (c && c.contains(document.activeElement)){ toggleEv(evOpen.uid); return; }
  }
  if (e.key === "Escape" && D.classList.contains("open")){ closeDrawer(); return; }
  // the open card is a modal dialog: Tab and Shift+Tab stay inside it (N-13, LF-5)
  if (e.key === "Tab" && D.classList.contains("open") && !$("rcMenu") && D.contains(document.activeElement)){
    const f = [...D.querySelectorAll('button, summary, a[href], input, [tabindex="0"]')].filter(x => !x.disabled && x.getClientRects().length);
    if (f.length && e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length - 1].focus(); }
    else if (f.length && !e.shiftKey && document.activeElement === f[f.length - 1]){ e.preventDefault(); f[0].focus(); }
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-uid],[role="button"][data-ev]')){
    e.preventDefault(); activate(e.target, e); }
});
renderFilters();
connect();
